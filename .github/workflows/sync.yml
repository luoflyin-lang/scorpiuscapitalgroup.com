name: Hourly Hyperliquid Sync

on:
  schedule:
    - cron: '0 * * * *' # 每小时运行一次
  workflow_dispatch: # 允许手动点击运行

jobs:
  sync-trades:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libs
        run: pip install requests

      - name: Fetch Trades
        run: python inbox/update_trades.py

      - name: Commit Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/documents/proprietary-trading/jyjl.md
          git commit -m "Auto-update Hyperliquid trades (Incremental)" || echo "No changes to commit"
          git push
