<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorpius Capital Group</title>
    <link rel="icon" href="docs/inbox/cover.jpeg" type="image/jpeg">
    <link rel="shortcut icon" href="docs/inbox/cover.jpeg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');    
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-900 m-0 p-0 font-sans">
<div class="relative w-full h-screen overflow-hidden text-white">

    <div class="absolute inset-0 z-10 bg-gradient-to-b from-black/50 via-black/10 to-black/80"></div>

    <header class="absolute top-0 w-full z-50 flex items-center justify-between px-4 py-4 md:px-10 md:py-8">
        <div class="flex items-center gap-4">
            <img src="docs/inbox/cover.jpeg" alt="Logo" class="w-10 h-10 rounded shadow-sm object-cover">
            <div class="text-xl font-bold tracking-tight whitespace-nowrap">
                美国天蝎座资本集团
            </div>
        </div>


    </header>

    <div class="absolute inset-0 z-20 flex flex-col items-center justify-center pointer-events-none text-white">
        <div class="font-bold tracking-tighter flex items-baseline" style="font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;">
            <span class="text-5xl md:text-8xl lg:text-9xl tabular-nums" id="aum-ticker">0</span>
            <span class="text-lg md:text-4xl lg:text-5xl ml-1 md:ml-3 tracking-normal">XTS</span>
        </div>
    </div>

    <footer class="absolute bottom-0 w-full h-10 z-50 flex items-center px-4 md:px-10 border-t border-white/20 text-gray-400 text-[10px] md:text-xs tracking-wider font-light">
        &copy; 2026 Scorpius Capital Group LLC. All rights reserved.
    </footer>
</div>
<script>
async function initTicker() {
    try {
        const response = await fetch('aum.csv');
        const text = await response.text();
        
        const lines = text.trim().split('\n').slice(1);
        const data = lines.map(line => {
            const [yearStr, valueStr] = line.split(',');
            const year = parseInt(yearStr.trim());
            const value = parseFloat(valueStr.trim());
            // Target is end of the year (Dec 31, 23:59:59.999)
            const timestamp = new Date(Date.UTC(year, 11, 31, 23, 59, 59, 999)).getTime();
            return { year, value, timestamp };
        }).sort((a, b) => a.timestamp - b.timestamp);

        if (data.length === 0) return;

        const tickerEl = document.getElementById('aum-ticker');

        function updateTicker() {
            const now = Date.now();
            let currentValue = 0;

            if (now <= data[0].timestamp) {
                const startOfYear = new Date(Date.UTC(data[0].year, 0, 1, 0, 0, 0, 0)).getTime();
                if (now < startOfYear) {
                    currentValue = 0;
                } else {
                    const ratio = (now - startOfYear) / (data[0].timestamp - startOfYear);
                    currentValue = ratio * data[0].value;
                }
            } else if (now >= data[data.length - 1].timestamp) {
                currentValue = data[data.length - 1].value;
            } else {
                for (let i = 0; i < data.length - 1; i++) {
                    if (now >= data[i].timestamp && now < data[i+1].timestamp) {
                        const start = data[i].timestamp;
                        const end = data[i+1].timestamp;
                        const ratio = (now - start) / (end - start);
                        currentValue = data[i].value + ratio * (data[i+1].value - data[i].value);
                        break;
                    }
                }
            }

            const formatted = Math.floor(currentValue)
                .toString()
                .replace(/\B(?=(\d{3})+(?!\d))/g, "<span style='display:inline-block; width:0.12em;'></span>");

            tickerEl.innerHTML = formatted;
            
            requestAnimationFrame(updateTicker);
        }

        requestAnimationFrame(updateTicker);

    } catch (e) {
        console.error("Failed to load AUM data:", e);
    }
}
initTicker();
</script>
</body>
</html>
