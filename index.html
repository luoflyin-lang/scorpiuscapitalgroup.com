<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Scorpius Capital Group</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Scorpius Capital Group LLC 仅从事自有资金投资，本网站用于展示公司资料、持仓披露、年度预测与财务报表目录。">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" type="image/jpeg" href="./inbox/logo.jpg">
  <link rel="stylesheet" href="./inbox/vue.css">
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      name: 'Scorpius Capital Group',
      loadSidebar: true,
      loadNavbar: true,
      routerMode: 'hash',
      notFoundPage: './_404.md',
      alias: {
        '/en/.*/_sidebar.md': '/en/_sidebar.md',
        '/en/.*/_navbar.md': '/en/_navbar.md',
        '/.*/_sidebar.md': '/_sidebar.md',
        '/.*/_navbar.md': '/_navbar.md'
      },
      plugins: [
        function (hook) {
          hook.afterEach(function (html, next) {
            var isEnglish = location.hash.indexOf('#/en/') === 0 || location.hash === '#/en';
            var footer = isEnglish
              ? '\n\n<hr />\n<footer>© 2026 Scorpius Capital Group LLC. All rights reserved. <a href="#/en/privacy">Privacy Policy</a> | <a href="#/en/terms">Terms of Use</a> | <a href="mailto:support@scorpiuscapitalgroup.com">support@scorpiuscapitalgroup.com</a></footer>'
              : '\n\n<hr />\n<footer>© 2026 Scorpius Capital Group LLC. All rights reserved. <a href="#/privacy">隐私政策</a> | <a href="#/terms">服务条款</a> | <a href="mailto:support@scorpiuscapitalgroup.com">support@scorpiuscapitalgroup.com</a></footer>';
            next(html + footer);
          });

          hook.doneEach(function () {
            const marker = document.getElementById('docsify-404-redirect');
            if (!marker) return;

            const target = marker.dataset.target || './404.html';
            const from = encodeURIComponent(location.hash || '#/');
            location.replace(target + '?from=' + from);
          });
        }
      ]
    };
  </script>

  <script src="./inbox/loader.js"></script>
  <script src="./inbox/docsify.min.js"></script>
  <script src="./inbox/search.min.js"></script>
  <script src="./inbox/emojiCursor.js"></script>
</body>
</html>
