<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Scorpius Capital Group</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="icon" type="image/jpeg" href="./inbox/cover.jpeg">
  <link rel="stylesheet" href="./inbox/vue.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');    
    body { font-family: 'Inter', sans-serif; }
    /* Fix for docsify coverpage conflicting with Tailwind absolute positioning */
    section.cover {
      padding: 0 !important;
      margin: 0 !important;
    }
    section.cover .cover-main {
      margin: 0 !important;
      max-width: none !important;
      width: 100% !important;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    window.$docsify = {
      coverpage: true,
      loadSidebar: true,
      loadNavbar: true,
    };
  </script>

  <script src="./inbox/docsify.min.js"></script>
  <script src="./inbox/search.min.js"></script>
  <script src="./inbox/emojiCursor.js"></script>
</body>
</html>
